services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    ports: ["8080:8080"]
    volumes: ["api-data:/app/var"]
    healthcheck:
      test: ["CMD", "/app/bin/api-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
  web:
    build:
      context: ../web
      dockerfile: ../infra/docker/Dockerfile.web
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  api-data:
